services:
  app:
    build: .
    container_name: app-ventas
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports: 
      - "8000:8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-app-ventas
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app_ventas
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: